<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#0d1628"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4fa3e8"/>
      <stop offset="100%" style="stop-color:#1a6bbf"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60b4f5"/>
      <stop offset="100%" style="stop-color:#1e7ad4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="100" rx="12" fill="url(#bgGrad)"/>

  <!-- Bottom disc -->
  <ellipse cx="50" cy="68" rx="20" ry="5.5" fill="#1a6bbf" opacity="0.6"/>
  <!-- Middle disc -->
  <ellipse cx="50" cy="58" rx="20" ry="5.5" fill="#2480d4" opacity="0.8"/>
  <!-- Top disc -->
  <ellipse cx="50" cy="48" rx="20" ry="5.5" fill="url(#iconGrad)" filter="url(#glow)"/>
  <!-- Cylinder body -->
  <rect x="30" y="48" width="40" height="20" fill="#183d6e" opacity="0.7"/>
  <line x1="30" y1="48" x2="30" y2="68" stroke="#2480d4" stroke-width="1.2" opacity="0.7"/>
  <line x1="70" y1="48" x2="70" y2="68" stroke="#2480d4" stroke-width="1.2" opacity="0.7"/>

  <!-- Central node above DB -->
  <circle cx="50" cy="32" r="5.5" fill="url(#iconGrad)" filter="url(#glow)"/>
  <!-- Left satellite node -->
  <circle cx="34" cy="22" r="3.5" fill="#2480d4" opacity="0.9"/>
  <!-- Right satellite node -->
  <circle cx="66" cy="22" r="3.5" fill="#2480d4" opacity="0.9"/>
  <!-- Edges -->
  <line x1="50" y1="32" x2="34" y2="22" stroke="#4fa3e8" stroke-width="1.3" opacity="0.8"/>
  <line x1="50" y1="32" x2="66" y2="22" stroke="#4fa3e8" stroke-width="1.3" opacity="0.8"/>
  <!-- Node to DB dashed connector -->
  <line x1="50" y1="37" x2="50" y2="43" stroke="#4fa3e8" stroke-width="1.3" opacity="0.5" stroke-dasharray="2,2"/>

  <!-- Wordmark -->
  <text
    x="92" y="62"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="36"
    font-weight="700"
    letter-spacing="-0.5"
    fill="url(#blueGrad)"
    filter="url(#glow)"
  >AgentDB</text>

  <!-- Tagline -->
  <text
    x="93" y="80"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="10"
    letter-spacing="2.5"
    fill="#4fa3e8"
    opacity="0.55"
  >SQL · VECTORS · MEMORY GRAPH</text>

</svg>