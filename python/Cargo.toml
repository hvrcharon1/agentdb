[package]
name         = "datacules-agentdb-python"
version      = "0.5.0"
edition      = "2021"
rust-version = "1.87"

[lib]
name      = "agentdb"
crate-type = ["cdylib"]

[dependencies]
agentdb = { package = "datacules-agentdb", path = "..", features = ["python"] }
pyo3    = { version = "0.29", features = ["extension-module"] }
serde_json = "1"
