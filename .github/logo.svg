  <line x1="47" y1="24" x2="47" y2="46" stroke="white" stroke-width="2.2"/>
  <ellipse cx="32" cy="35" rx="15" ry="4.5" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="32" cy="46" rx="15" ry="4.5" fill="none" stroke="white" stroke-width="2" opacity="0.65"/>

