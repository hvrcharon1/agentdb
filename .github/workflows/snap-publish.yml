name: Publish Snap

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Required secret:
#   SNAPCRAFT_STORE_CREDENTIALS — export with: snapcraft export-credentials --snaps datacules-agentdb snap.creds
#   Then: base64 -w0 snap.creds  and store the result as the secret value.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update snapcraft.yaml version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/^version: .*/version: '${TAG_VERSION}'/" snap/snapcraft.yaml

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft-channel: latest/stable

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
