name: Publish Python wheels

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}

      - name: Install maturin
        run: pip install maturin

      - name: Copy README into python package
        run: cp README.md python/README.md

      - name: Build wheel
        working-directory: python
        run: maturin build --release --out dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: python/dist/*.whl

  # Build manylinux wheel for broad Linux compatibility.
  build-manylinux:
    name: Build manylinux wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy README into python package
        run: cp README.md python/README.md
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          args: --release --out dist --manylinux auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux
          path: python/dist/*.whl

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-manylinux]
    permissions:
      id-token: write   # OIDC trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/datacules-agentdb

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses PyPI Trusted Publishing (OIDC) — no token secret needed.
        # Configure at: https://pypi.org/manage/project/datacules-agentdb/settings/publishing/
