version: 2
updates:
  # Rust / Cargo
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      rust-deps:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # Node.js binding
  - package-ecosystem: npm
    directory: "/nodejs"
    schedule:
      interval: weekly
      day: monday
    groups:
      nodejs-deps:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # Python binding
  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: weekly
      day: monday
    groups:
      python-deps:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-deps:
        patterns:
          - "*"
    open-pull-requests-limit: 5
