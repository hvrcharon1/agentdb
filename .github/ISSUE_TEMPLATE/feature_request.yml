name: Feature Request
description: Suggest a new feature or improvement for AgentDB
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to AgentDB! Please fill in the
        sections below so we can evaluate and prioritise your request effectively.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: |
        What problem does this feature solve? What are you trying to do that is
        currently difficult or impossible with AgentDB?
      placeholder: "When I try to …, I find that …"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: |
        Describe the feature you would like to see. Include an example API
        sketch if applicable.
      placeholder: |
        ```rust
        // e.g. vector deletion
        let col = db.vectors().collection("thoughts", 384)?;
        col.delete("t1")?;
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Any alternative approaches or workarounds you have tried or considered.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of AgentDB does this relate to?
      options:
        - Vector Store / HNSW
        - Memory Graph
        - Full-Text Search
        - Hybrid Queries
        - SQL Layer
        - Python SDK
        - Node.js SDK
        - C FFI / WASM
        - CI / Release tooling
        - Documentation
      multiple: true
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: |
        Links to related work, research papers, or prior art that informed
        this request.
