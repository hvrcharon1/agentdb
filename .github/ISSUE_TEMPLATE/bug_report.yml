name: Bug Report
description: File a bug report to help us improve AgentDB
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this bug report.
        Please provide as much detail as possible so we can reproduce and fix the
        issue quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you observed…
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        Provide the smallest possible code snippet that reproduces the issue.
      placeholder: |
        ```rust
        let db = AgentDB::open(":memory:").unwrap();
        // …
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: |
        What actually happened? Include full error messages, panic traces, or
        unexpected output.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AgentDB version
      placeholder: "e.g. 0.3.0"
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Language binding
      description: Which interface are you using?
      options:
        - Rust (core library)
        - Python (PyPI package)
        - Node.js (npm package)
        - C FFI
        - WASM
      multiple: true
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and architecture
      placeholder: "e.g. macOS 14 arm64, Ubuntu 24.04 x86_64, Windows 11 x64"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: |
        Any other context that might help: screenshots, log output, Cargo.lock
        snippet, Rust toolchain version (`rustc --version`), etc.
