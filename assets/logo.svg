<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 112" width="315" height="112">
  <defs>
    <style>
      .wm { fill: #111827; }
      .tl { fill: #64748B; }
      @media (prefers-color-scheme: dark) {
        .wm { fill: #F1F5F9; }
        .tl { fill: #475569; }
      }
    </style>
  </defs>

  <!-- Badge: deep slate rounded square -->
  <rect x="4" y="8" width="96" height="96" rx="20" fill="#0F172A"/>

  <!-- Agent circuit node: ring + inner dot (sky-blue accent) -->
  <circle cx="52" cy="25" r="7" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="52" cy="25" r="2.5" fill="#38BDF8"/>

  <!-- Thin connector from agent node to top data layer bar -->
  <line x1="52" y1="33" x2="52" y2="39" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>

  <!-- Five equal-width data layer bars: light (abstract) at top, dark (foundational) at bottom -->
  <!-- Layer 5: Hybrid Queries -->
  <rect x="16" y="40" width="72" height="9" rx="2.5" fill="#93C5FD"/>
  <!-- Layer 4: Full-Text Search -->
  <rect x="16" y="52" width="72" height="9" rx="2.5" fill="#60A5FA"/>
  <!-- Layer 3: Memory Graph -->
  <rect x="16" y="64" width="72" height="9" rx="2.5" fill="#3B82F6"/>
  <!-- Layer 2: Vector Search -->
  <rect x="16" y="76" width="72" height="9" rx="2.5" fill="#2563EB"/>
  <!-- Layer 1: Relational SQL (foundation, darkest) -->
  <rect x="16" y="88" width="72" height="9" rx="2.5" fill="#1D4ED8"/>

  <!-- Wordmark: Agent (light weight) + DB (ultra-bold) -->
  <text x="114" y="65"
    class="wm"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="36">
    <tspan font-weight="300">Agent</tspan><tspan font-weight="800" dx="-1">DB</tspan>
  </text>

  <!-- Tagline -->
  <text x="115" y="84"
    class="tl"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="10"
    letter-spacing="2.2">EMBEDDED AI DATABASE</text>
</svg>
