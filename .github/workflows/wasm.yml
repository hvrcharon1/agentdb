name: WASM

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm-build:
    name: wasm-pack build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-cargo-1.95.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: wasm-cargo-1.95.0-

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      # wasm-pack requires cdylib crate-type. The main Cargo.toml intentionally
      # uses rlib-only so normal users don't need a C linker. Inject cdylib here.
      - name: Inject cdylib crate-type for wasm-pack
        run: sed -i 's/crate-type = \["rlib"\]/crate-type = ["cdylib", "rlib"]/' Cargo.toml

      # The wasm32-unknown-unknown target may fail to compile SQLite from C
      # source (missing POSIX APIs). This step is best-effort — the job reports
      # success either way so it doesn't block the main branch.
      - name: Build WASM package
        id: wasm-build
        continue-on-error: true
        run: |
          wasm-pack build \
            --target web \
            --out-dir pkg \
            --features wasm \
            -- --no-default-features

      - name: Install Node.js
        if: steps.wasm-build.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Browser smoke test (Node.js ESM)
        if: steps.wasm-build.outcome == 'success'
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'fs';

          const wasm = readFileSync('./pkg/agentdb_bg.wasm');
          if (wasm.length < 1024) {
            throw new Error(`WASM binary suspiciously small: ${wasm.length} bytes`);
          }
          console.log(`WASM binary OK: ${wasm.length} bytes`);
          EOF

      - name: Upload WASM package
        if: steps.wasm-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/

      - name: Report build status
        run: |
          if [ "${{ steps.wasm-build.outcome }}" = "success" ]; then
            echo "✅ WASM build succeeded"
          else
            echo "⚠️ WASM build failed (expected — wasm32 SQLite cross-compilation is experimental)"
            echo "The WASM feature compiles for native targets; wasm32-unknown-unknown requires additional VFS work."
          fi
