name: Publish Chocolatey

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Required secret:
#   CHOCO_API_KEY — your Chocolatey.org API key (account → API keys).

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Wait for release assets
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          URL="https://github.com/hvrcharon1/agentdb/releases/download/v${TAG_VERSION}/checksums-sha256.txt"
          for i in $(seq 1 30); do
            if curl -sLf "$URL" -o checksums.txt; then
              echo "Release assets available"
              break
            fi
            echo "Waiting for release assets... ($i/30)"
            sleep 10
          done

      - name: Update checksum and version
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          SHA_WIN=$(grep 'x86_64-pc-windows-msvc' checksums.txt | awk '{print $1}')

          # Convert to Unix line endings before editing, then back to CRLF after
          sed -i 's/\r//' choco/tools/chocolateyinstall.ps1
          sed -i "s/\\\$version     = .*/\$version     = '${TAG_VERSION}'/" choco/tools/chocolateyinstall.ps1
          sed -i "s/checksum64    = .*/checksum64    = '${SHA_WIN}'/" choco/tools/chocolateyinstall.ps1
          sed -i "s/<version>.*<\/version>/<version>${TAG_VERSION}<\/version>/" choco/agentdb.nuspec

      - name: Pack and push
        shell: pwsh
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_VERSION -replace '^v', ''
          Set-Location choco
          choco pack agentdb.nuspec
          # choco pack names the file agentdb.<version>.nupkg
          choco push "agentdb.$version.nupkg" --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCO_API_KEY }}
