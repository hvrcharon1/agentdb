name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  # ── Step 0: ensure Cargo.lock exists in the repo ─────────────────────
  # Runs cargo generate-lockfile and commits the result back to main
  # when the lockfile is missing or has drifted from Cargo.toml.
  # All other jobs depend on this so cache keys always resolve.
  # Skipped on pull_request events (forks cannot push back to main).
  bootstrap-lockfile:
    name: Bootstrap Cargo.lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      lockfile_sha: ${{ steps.commit.outputs.lockfile_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so we can push back cleanly.
          fetch-depth: 0
          # Use the built-in GITHUB_TOKEN so the push is authenticated.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75.0"

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Commit Cargo.lock if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Cargo.lock 2>/dev/null && git ls-files --error-unmatch Cargo.lock 2>/dev/null; then
            echo "Cargo.lock is already up to date."
            echo "lockfile_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git add Cargo.lock
            git commit -m "chore(ci): update Cargo.lock [skip ci]"
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              git push origin main
            fi
            echo "lockfile_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # ── Step 1: lint ─────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: bootstrap-lockfile

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.75.0 (lint)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75.0"
          components: rustfmt, clippy

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.75.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-1.75.0-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Note: --all-features is intentionally omitted. The wasm feature uses
      # wasm-bindgen macros that are only valid on the wasm32 target, and the
      # python feature requires a cdylib crate type. Both cause clippy to fail
      # on native x86_64 runners. Default features (empty set) + --all-targets
      # covers all library, test, example, and bench code.
      - name: Clippy
        run: cargo clippy --all-targets

  # ── Step 2: test matrix ───────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: bootstrap-lockfile
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.75.0 (test)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75.0"

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.75.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-1.75.0-

      # Skip cdylib so Windows/macOS don't need a C dynamic-lib toolchain.
      - name: Build
        run: cargo build --lib --tests --examples --benches

      - name: Test
        run: cargo test --lib --tests -- --nocapture

      - name: Run examples
        run: |
          cargo run --example agent_memory
          cargo run --example rag_pipeline
          cargo run --example graph_traverse
          cargo run --example v020_query_power

  # ── Step 3: security audit ────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: bootstrap-lockfile
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit

  # ── Step 4: coverage ──────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: bootstrap-lockfile

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.75.0 (coverage)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75.0"

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-1.75.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cov-1.75.0-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Coverage
        run: cargo tarpaulin --out Xml --output-dir coverage/ --skip-clean

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false
