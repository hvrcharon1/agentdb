# Codecov configuration for AgentDB
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "60...100"

  status:
    project:
      default:
        # Fail CI if overall coverage drops below 80%.
        target: 80%
        threshold: 2%
        if_not_found: success
        if_ci_failed: error
    patch:
      default:
        # New code added in a PR must be at least 80% covered.
        target: 80%
        threshold: 2%
        if_not_found: success
        if_ci_failed: error

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "header, diff, flags, components, footer"
  behavior: default
  require_changes: false

ignore:
  - "python/**"
  - "nodejs/**"
  - "examples/**"
  - "benches/**"
