name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  # ── Step 1: lint ─────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95.0 (lint)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.95.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-1.95.0-

      - name: Update crossbeam-epoch (fix RUSTSEC-2026-0204)
        run: cargo update crossbeam-epoch --precise 0.9.20

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Note: --all-features is intentionally omitted. The wasm feature uses
      # wasm-bindgen macros that are only valid on the wasm32 target, and the
      # python feature requires a cdylib crate type. Both cause clippy to fail
      # on native x86_64 runners. Default features (empty set) + --all-targets
      # covers all library, test, example, and bench code.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # ── Step 2: test matrix ───────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95.0 (test)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.95.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-1.95.0-

      - name: Update crossbeam-epoch (fix RUSTSEC-2026-0204)
        run: cargo update crossbeam-epoch --precise 0.9.20

      # --locked flag removed because we updated Cargo.lock above via cargo update.
      # Skip cdylib so Windows/macOS don't need a C dynamic-lib toolchain.
      - name: Build
        run: cargo build --lib --tests --examples --benches

      - name: Test
        run: cargo test --lib --tests -- --nocapture

      - name: Test (async feature)
        run: cargo test --features async --test test_async -- --nocapture

      - name: Test (ffi feature)
        if: runner.os == 'Linux'
        run: cargo test --features ffi --test test_ffi -- --nocapture

      - name: Run examples
        run: |
          cargo run --example agent_memory
          cargo run --example rag_pipeline
          cargo run --example graph_traverse
          cargo run --example v020_query_power
          cargo run --example ai_agent_loop

  # ── Step 3: security audit ────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Update crossbeam-epoch (fix RUSTSEC-2026-0204)
        run: cargo update crossbeam-epoch --precise 0.9.20

      - name: Audit
        run: cargo audit

  # ── Step 4: coverage ──────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for Codecov OIDC tokenless upload

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (coverage)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cov-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Update crossbeam-epoch (fix RUSTSEC-2026-0204)
        run: cargo update crossbeam-epoch --precise 0.9.20

      - name: Coverage
        run: >-
          cargo tarpaulin
          --features async,ffi
          --tests
          --out Xml
          --output-dir coverage/
          --skip-clean

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false
