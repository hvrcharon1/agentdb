<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 102" width="310" height="102">
  <defs>
    <style>
      .wm { fill: #111827; }
      .tl { fill: #94A3B8; }
      @media (prefers-color-scheme: dark) {
        .wm { fill: #E2E8F0; }
        .tl { fill: #64748B; }
      }
    </style>
  </defs>

  <!-- Badge: deep slate rounded square -->
  <rect x="4" y="7" width="88" height="88" rx="16" fill="#0F172A"/>

  <!-- Five data-layer bars — pyramid form:
       widest at bottom (Relational SQL) → narrowest at top (Hybrid Queries)
       All bars centered at x=48 inside the badge.
       Stack height 57 px, vertically centered in 88 px badge. -->

  <!-- Layer 5 — Hybrid Queries (top) -->
  <rect x="36" y="23" width="24" height="9" rx="2" fill="#93C5FD"/>
  <!-- Layer 4 — Full-Text Search -->
  <rect x="30" y="35" width="36" height="9" rx="2" fill="#60A5FA"/>
  <!-- Layer 3 — Memory Graph -->
  <rect x="24" y="47" width="48" height="9" rx="2" fill="#3B82F6"/>
  <!-- Layer 2 — Vector Search -->
  <rect x="18" y="59" width="60" height="9" rx="2" fill="#2563EB"/>
  <!-- Layer 1 — Relational SQL (bottom, widest = foundation) -->
  <rect x="12" y="71" width="72" height="9" rx="2" fill="#1D4ED8"/>

  <!-- Wordmark -->
  <text x="108" y="60"
    class="wm"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="34"
    font-weight="700"
    letter-spacing="-0.5">AgentDB</text>

  <!-- Tagline -->
  <text x="109" y="78"
    class="tl"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="10"
    letter-spacing="2.2">EMBEDDED AI DATABASE</text>
</svg>
