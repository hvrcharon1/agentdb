[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-agentdb"
version = "0.1.0"
description = "LangChain VectorStore and Memory integrations backed by AgentDB"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["langchain", "agentdb", "vectorstore", "memory", "llm", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.2.0",
    "datacules-agentdb>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/datacules/agentdb"
Repository = "https://github.com/datacules/agentdb"
"Bug Tracker" = "https://github.com/datacules/agentdb/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_agentdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
