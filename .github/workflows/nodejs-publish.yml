name: Publish Node.js package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build-native:
    name: Build native addon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-node-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: nodejs/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('nodejs/package.json') }}

      - name: Install napi-rs CLI
        working-directory: nodejs
        run: npm install

      - name: Build native addon
        working-directory: nodejs
        run: npm run build

      - name: Upload native addon
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: nodejs/*.node

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-native

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download all native addons
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: nodejs/

      - name: Publish to npm
        working-directory: nodejs
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
